InpaintModeDesc = 基础版、增强版和 STTN快速擦除可按视频类型选择
    STTN字幕检测 带字幕检测版, 无智能擦除(最低4GB显存)
    LAMA: 对于动画类视频效果好，速度一般(显存要求较低)
    ProPainter: 需要消耗大量显存，速度较慢，对运动非常剧烈的视频效果较好(最低8GB显存)
    OpenCV: 极速模式, 不保证inpaint效果，仅仅对包含文本的区域文本进行去除(显存要求较低)
